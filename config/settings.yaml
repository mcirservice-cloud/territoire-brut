# Paramètres du robot « Varus » pour la chaîne « Territoire Brut »
# Tous les secrets (clés API, identifiants YouTube) sont lus depuis les
# variables d'environnement : JAMAIS de clé dans ce fichier.

robot:
  nom: "Varus"

chaine:
  nom: "Territoire Brut"
  langue: "fr"
  categorie_youtube: 15  # Animaux (Pets & Animals)

voix:
  moteur: "kokoro"
  voix: "ff_siwis"  # seule voix française du modèle Kokoro-82M officiel
  vitesse: 1.0
  pause_entre_scenes_s: 0.4

video:
  largeur: 1920
  hauteur: 1080
  fps: 25
  codec: "libx264"
  preset: "fast"

script:
  modele_gemini: "gemini-3.8-flash"
  temperature: 0.7
  essais_max: 3
  mots_par_minute: 150
  faits_max_caracteres: 9000
  duree_scene_min_s: 4
  duree_scene_max_s: 12
  part_max_clip_ia: 0.2

fact_check:
  modele_gemini: "gemini-3.8-flash"  # la même clé Gemini que le script
  correction_max_tentatives: 2  # boucle de correction BORNÉE : après
  # 2 tentatives, publication BLOQUÉE mais tout sauvegardé (blocage.json)

llm_chaine:
  # Chaîne LLM pour le scénario et le fact-check (règle : chaque
  # tâche a au moins deux alternatives). Le premier fournisseur qui répond
  # gagne ; une couche sans clé est ignorée (log, pas d'erreur).
  # GÉNÉRATION du script (depuis le remplacement de Gemini, 2026-10-29) :
  # OpenRouter gratuit d'abord, puis DeepSeek, puis Gemini REST borné en
  # dernier recours uniquement (aucun appel SDK sans limite).
  # RÉFLEXION (fact-check / correction) : DeepSeek d'abord, puis Gemini
  # REST borné, puis OpenRouter gratuit.
  # Aucune clé ici : elles viennent des variables d'environnement.
  gemini_modeles:
    - "gemini-3.8-flash"
    - "gemini-3.5-flash"  # même clé GEMINI_API_KEY, autre modèle ; dernier recours génération
  deepseek_modele: "deepseek-chat"  # clé DEEPSEEK_API_KEY
  deepseek_modele_reflexion: "deepseek-chat"  # réflexion (fact-check /
  # correction) : DeepSeek d'abord, puis Gemini, puis OpenRouter gratuit.
  # "deepseek-reasoner" accepté ici, mais plus lent et plus cher :
  # ne PAS en faire le défaut.
  openrouter_modele_payant: "z-ai/glm-5.3-flash"  # clé OPENROUTER_API_KEY ; conservé en configuration mais HORS du chemin de génération (choix gratuit : OpenRouter gratuit d'abord, Gemini borné ensuite)
  openrouter_modeles_gratuits:
    - "google/gemma-4-31b-it:free"  # gratuit, mais le catalogue :free change souvent
  openrouter_secours_auto: "openrouter/free"  # routeur gratuit automatique, dernier recours
  openrouter_modele_generation: "google/gemma-4-31b-it:free"  # génération du script : OpenRouter GRATUIT en premier (moteur principal, remplace Gemini)
  openrouter_timeout_s: 300  # timeout par requête OpenRouter pour la génération (au-delà : repli suivant, jamais de blocage)
  delais_reessai_s: [30, 60, 120]  # réessais sur erreurs temporaires (429/5xx)

visuels:
  priorite: "openverse"  # Openverse (photos, sans clé) puis Wikimedia (photos + vidéos, sans clé)
  secours: "wikimedia"  # Pixabay / Pexels seulement si leurs clés sont présentes
  largeur_min_px: 1280
  requetes_max_par_scene: 1
  reutilisation_interdite_nb_videos: 5  # ne pas réutiliser un clip dans les 5 dernières vidéos
  budget_scene_s: 300  # plafond de recherche par scène (au-delà : échec
  # rapide avec message clair, au lieu de brûler le budget du job)

validation_frames:
  echantillons: 8  # frames échantillonnées sur la vidéo finale
  seuil_noir: 8  # luminance moyenne < 8 = frame quasi noire
  proportion_max_noires: 0.8  # au-delà : rendu considéré invalide

audio:
  musique_volume: 0.35
  ambiance_volume: 0.25
  loudnorm: "I=-16:TP=-1.5:LRA=11"

publication:
  # Mode relecture par défaut : vidéo privée + planifiée, artefact archivé 3 jours.
  privacy_status: "private"
  delai_publication_heures: 2  # publishAt = fin du run + ce délai
  contient_media_synthetique: true
  shorts_par_video: 3
  duree_short_min_s: 25
  duree_short_max_s: 45

dossiers:
  cache: "cache"
  sortie: "output"
  sujets_csv: "topics.csv"
