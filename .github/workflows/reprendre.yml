name: Reprendre Varus (rien ne se perd)

# Le plus fort : reprendre EXACTEMENT là où le dernier run s'est
# arrêté, pour continuer et livrer la vraie vidéo.
# - Script déjà préparé : jamais régénéré.
# - Segments déjà montés : jamais refaits.
# - Seul le travail manquant est refait, puis assemblage + livraison.
# Lancement manuel UNIQUEMENT, après un run interrompu.
on:
  workflow_dispatch:
    inputs:
      run_precedent:
        description: "ID du run à reprendre (vide = dernier run rapide)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

# Jamais deux reprises en même temps.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reprendre:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu
      - name: Dépendances Python
        run: pip install -r requirements.txt
      - name: Cache modèle voix
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}
      # Restaure les artefacts du run précédent, si le run est donné
      # ou si un dernier run rapide existe. Si rien n'est trouvé,
      # le stage reprendre refait tout (prepare ALPHA/BÉTA) : on ne
      # perd jamais la vidéo pour un artefact manquant.
      - name: Restaurer le travail déjà fait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ inputs.run_precedent }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow publish-fast.yml --limit 1 --json databaseId -q '.[0].databaseId' || true)
          fi
          echo "Run à reprendre : $RUN_ID"
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n prepare -D output || echo "pas d'artefact prepare à restaurer"
            gh run download "$RUN_ID" -p 'shard-*' -D output || echo "pas d'artefact shard à restaurer"
          fi
          ls -R output || echo "output vide : reprise complète"
      - name: Tests rapides
        run: |
          python3 tests/test_smoke_v2.py
          python3 tests/test_fast_pipeline.py
          python3 tests/test_gardefous.py
          python3 tests/test_openrouter_first.py
          python3 tests/test_plan_b.py
          python3 tests/test_reprendre.py
          python3 tests/test_auto_correcteur.py
          python3 tests/test_mix.py
          python3 tests/test_concat_voix.py
          python3 tests/test_upload_miniature.py
          python3 tests/test_montage_pro.py
      - name: Reprendre et livrer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEETS_REFRESH_TOKEN: ${{ secrets.SHEETS_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -u src/fast_pipeline.py --stage reprendre
      - name: Rapport garde-fou
        if: always()
        run: test -f output/echec-garde-fou.json && cat output/echec-garde-fou.json || echo "aucun échec garde-fou"
      - name: Archiver vidéo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-reprise-${{ github.run_id }}
          path: output/
          retention-days: 3
